spring:
  main:
    lazy-initialization: true
  application:
    name: ms-servicename-facade

  # ── Jackson 3 / Boot 4 ──────────────────────────────────────────────
  # Namespaces corregidos vs Boot 3.5:
  #   default-property-inclusion → raíz (no bajo .mapper)
  #   write-dates-as-timestamps  → .datatype.datetime (no .serialization)
  #   .mapper                    → solo MapperFeature enums
  jackson:
    time-zone: ${TIMEZONE:UTC}
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false   # ya es default en Jackson 3
    mapper:
      sort-properties-alphabetically: true

  # Virtual Threads — Boot 4
  threads:
    virtual:
      enabled: true

  # API Versioning nativo — Framework 7
  webflux:
    apiversion:
      header-name: X-API-Version
      default-version: "1.0"

server:
  port: 8080
  address: 0.0.0.0

stored-procedure:
  sp-content: ${STORED_PROCEDURE_CONTENT}

database:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:1433}
  name: ${DB_NAME:}
  username: ${DB_USERNAME:sa}
  password: ${DB_PASSWORD:YourStrong!Passw0rd}

  security:
    ssl-enabled: ${DB_SSL_ENABLED:false}
    trust-server-certificate: ${DB_TRUST_SERVER_CERTIFICATE:false}
    trust-store: ${DB_TRUST_STORE:}
    trust-store-password: ${DB_TRUST_STORE_PASSWORD:}
    trust-store-type: ${DB_TRUST_STORE_TYPE:PKCS12}
    host-name-in-certificate: ${DB_HOSTNAME_IN_CERTIFICATE:}

# Springdoc 3.x (compatible Boot 4)
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

info:
  app:
    name: ${spring.application.name}
    description: "API REST para el microservicio de ejemplo"
    version: "1.0.0"
    encoding: "UTF-8"
    java:
      version: "21"
    url: "http://localhost:8080"
  raulrobinson:
    archetype:
      version: "1.0.0"
      architecture: "Clean Architecture + Hexagonal"
      libraries:
        - "com.raulbolivar:1.0.0-SNAPSHOT"

support:
  logging:
    level: DEBUG
    masking:
      enabled: true
      fields:
        body:
          type: LEFT
          visible: 40
        authorization:
          type: FULL
        password:
          type: FULL
        clientSecret:
          type: FULL
        cardNumber:
          type: RIGHT
          visible: 4
        accountNumber:
          type: RIGHT
          visible: 4
        customerId:
          type: LEFT
          visible: 3
        email:
          type: NONE

# Actuator — Liveness/Readiness ON per defecto in Boot 4
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries,prometheus,env
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
    info:
      access: unrestricted
    metrics:
      access: unrestricted
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    defaults:
      enabled: false
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.r2dbc: DEBUG
    io.r2dbc.mssql: INFO
    com.raulbolivar.servicename: DEBUG